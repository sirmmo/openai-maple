name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.variant }} image to GHCR
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # CPU wheels are small and exist for both architectures.
          - variant: cpu
            torch_index: https://download.pytorch.org/whl/cpu
            platforms: linux/amd64,linux/arm64
            suffix: ""
          # CUDA wheels are amd64-only and several GB; skip the arm64 build and
          # keep only a minimal layer cache so the 10GB GHA cache is not blown.
          - variant: cuda
            torch_index: https://download.pytorch.org/whl/cu124
            platforms: linux/amd64
            suffix: -cuda
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (CUDA wheels are large)
        if: matrix.variant == 'cuda'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-qemu-action@v3
        if: contains(matrix.platforms, 'arm64')
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            # main -> :latest / :latest-cuda, plus an immutable sha tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            # v1.2.3 -> :1.2.3 and :1.2; a stable tag also moves :latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: |
            TORCH_INDEX=${{ matrix.torch_index }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=${{ matrix.variant == 'cpu' && 'max' || 'min' }}
